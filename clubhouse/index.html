<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club House Menu</title>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <meta name="theme-color" content="#f4f7f0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="favicon.ico">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="base.css?v=5bd09a64">
    <link rel="stylesheet" href="tema.css?v=9f91e694">
</head>
<body>
    <header>
        <div class="header-logos">
            <img src="logo-clubhouse.png" alt="Logo Club House" class="header-logo">
            <span id="header-menu-title"></span>
            <img src="negro.png" alt="Logo Negro" class="header-logo">
        </div>

        <div id="language-selector">
            <button id="btn-ES" onclick="changeLanguage('ES')" class="active">Español</button>
            <button id="btn-EN" onclick="changeLanguage('EN')">English</button>
            <button id="btn-DE" onclick="changeLanguage('DE')">Deutsch</button>
            <button id="btn-FR" onclick="changeLanguage('FR')">Français</button>
            <button id="btn-IT" onclick="changeLanguage('IT')">Italiano</button>
            <select id="more-langs" onchange="changeLanguage(this.value)">
                <option value="">🌐 Más...</option>
            </select>
        </div>
        <div class="category-wrapper">
            <nav id="category-selector"></nav>
        </div>
    </header>

    <main id="menu-container">
        <h2 id="current-category-name"></h2>
        <div id="items-list">
            <div class="item-row skeleton-row">
                <div class="item-content">
                    <span class="skeleton-text line-70"></span>
                    <span class="skeleton-text line-40"></span>
                </div>
                <div class="price-box">
                    <span class="skeleton-text line-20"></span>
                </div>
            </div>
            <div class="item-row skeleton-row">
                <div class="item-content">
                    <span class="skeleton-text line-60"></span>
                    <span class="skeleton-text line-30"></span>
                </div>
                <div class="price-box">
                    <span class="skeleton-text line-20"></span>
                </div>
            </div>
            <div class="item-row skeleton-row">
                <div class="item-content">
                    <span class="skeleton-text line-50"></span>
                    <span class="skeleton-text line-40"></span>
                </div>
                <div class="price-box">
                    <span class="skeleton-text line-20"></span>
                </div>
            </div>
        </div>
    </main>

    <div id="photo-modal" onclick="closeModal()">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <button id="prev-btn" class="nav-btn" onclick="changePhoto(-1); event.stopPropagation();">❮</button>
        <img id="modal-img" src="" alt="Vista previa" onclick="event.stopPropagation();">
        <button id="next-btn" class="nav-btn" onclick="changePhoto(1); event.stopPropagation();">❯</button>
    </div>

    <!-- Generado por construir.ps1: no editar aquí sino en nucleo/ y restaurantes/. -->
    <script>window.CARTA_BUILD = {"restaurante":"clubhouse","entorno":"pruebas","v":"20261109185749"};</script>
    <script src="restaurante.js?v=c22e43d5"></script>
    <script src="script.js?v=e80072f2"></script>
</body>
</html>
